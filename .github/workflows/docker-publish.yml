name: Build and push Pi image

on:
  push:
    branches: [main, stage]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: garsone-core-pi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Core build
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Select release channel
        id: release
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "channel=STABLE" >> "$GITHUB_OUTPUT"
            echo "moving_tag=pi" >> "$GITHUB_OUTPUT"
            echo "alias_tag=stable" >> "$GITHUB_OUTPUT"
            echo "webhook_url=https://order-flow-api-3uuy.onrender.com/internal/pi-releases" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "stage" ]; then
            echo "channel=STAGE" >> "$GITHUB_OUTPUT"
            echo "moving_tag=stage" >> "$GITHUB_OUTPUT"
            echo "alias_tag=canary" >> "$GITHUB_OUTPUT"
            echo "webhook_url=https://order-flow-api-3uuy.onrender.com/internal/pi-releases" >> "$GITHUB_OUTPUT"
          else
            echo "Pi releases are allowed only from main or stage" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARM64 image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            mikedim95/garsone-core:${{ steps.release.outputs.moving_tag }}
            mikedim95/garsone-core:${{ steps.release.outputs.alias_tag }}
            mikedim95/garsone-core:${{ steps.release.outputs.alias_tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Request short-lived release identity
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("garsone-pi-release");
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Register immutable Core release
        shell: bash
        env:
          WEBHOOK_URL: ${{ steps.release.outputs.webhook_url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image_ref="mikedim95/garsone-core@${IMAGE_DIGEST}"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(mktemp)"
          jq -n \
            --arg component "CORE" \
            --arg channel "$CHANNEL" \
            --arg imageRef "$image_ref" \
            --arg sourceRepo "$GITHUB_REPOSITORY" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg publishedAt "$published_at" \
            '{component:$component,channel:$channel,imageRef:$imageRef,sourceRepo:$sourceRepo,sourceSha:$sourceSha,workflowRunId:$workflowRunId,publishedAt:$publishedAt}' \
            > "$payload"
          curl --fail-with-body --retry 20 --retry-delay 15 --retry-all-errors \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            --data-binary "@$payload"
